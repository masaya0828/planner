<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>プランナー</title>
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="プランナー">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow phone column; sticky date header, content list, bottom tab bar + floating add button */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#17202a; --muted:#5d6a77; --line:#dbe1e7;
  --accent:#1c5a8c; --accent-ink:#ffffff; --accent-soft:#e2edf6;
  --cat0:#2c5bcc; --cat1:#2a8352; --cat2:#b8640f; --cat3:#87479f; --cat4:#677380; --cat5:#b8364f; --cat6:#127a86; --cat7:#8a6d00;
  --danger:#b2382e; --ok:#2a8352;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#172029; --ink:#e5eaef; --muted:#97a3af; --line:#29343f;
  --accent:#73aee0; --accent-ink:#0b1a27; --accent-soft:#1b2e3f;
  --cat0:#7b9cf0; --cat1:#5dbb86; --cat2:#e3a050; --cat3:#c08ad6; --cat4:#9aa5b1; --cat5:#ec8098; --cat6:#4fc1cc; --cat7:#d6b84a;
  --danger:#ec7d72; --ok:#5dbb86; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#172029; --ink:#e5eaef; --muted:#97a3af; --line:#29343f;
  --accent:#73aee0; --accent-ink:#0b1a27; --accent-soft:#1b2e3f;
  --cat0:#7b9cf0; --cat1:#5dbb86; --cat2:#e3a050; --cat3:#c08ad6; --cat4:#9aa5b1; --cat5:#ec8098; --cat6:#4fc1cc; --cat7:#d6b84a;
  --danger:#ec7d72; --ok:#5dbb86; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
input[type=text],input[type=password],input[type=url]{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:16px}
.conflict{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1px solid var(--danger);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ok{color:var(--ok)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:0 140px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line)}
.hd-main{flex:1;min-width:0}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.06em;color:var(--muted)}
h1{font-size:24px;font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
.nav{display:flex;gap:6px}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:38px;height:36px;padding:0 10px;font-size:14px}
.status{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.status.err{color:var(--danger)}

main{display:flex;flex-direction:column;gap:22px;padding-top:16px}
section h2{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
section h2 .cnt{font-family:var(--f-num);font-weight:500}
section h2 .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font-size:13px;font-weight:500;padding:4px 0}

ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
ul.list>li{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
ul.list>li:first-child{border-top:0}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.done .check{background:var(--accent);border-color:var(--accent)}
.done .check svg{opacity:1;stroke:var(--accent-ink)}
.tbody{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;gap:3px}
.ttext{overflow-wrap:anywhere}
.done .ttext{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}
.cc-0{--cc:var(--cat0)}.cc-1{--cc:var(--cat1)}.cc-2{--cc:var(--cat2)}.cc-3{--cc:var(--cat3)}.cc-4{--cc:var(--cat4)}.cc-5{--cc:var(--cat5)}.cc-6{--cc:var(--cat6)}.cc-7{--cc:var(--cat7)}
.tag-exp{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;border:1px solid currentColor;color:var(--ink)}
.goal-ref{overflow-wrap:anywhere}
.side-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:4px 10px;color:var(--accent);font-weight:500}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.note{font-size:13px;color:var(--muted)}

.callout{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.callout span{flex:1}

/* week */
.day{display:flex;flex-direction:column;gap:6px}
.dayhd{display:flex;align-items:baseline;gap:8px;font-size:14px}
.dayhd b{font-weight:700}
.dayhd .d{font-family:var(--f-num);color:var(--muted);font-size:13px}
.dayhd .sp{flex:1}
.dayhd.today b{color:var(--accent)}
.dayhd .add{border:0;background:none;color:var(--accent);font-size:20px;line-height:1;padding:0 4px}
.mini-empty{font-size:13px;color:var(--muted);padding:2px 0 0 2px}
.tmemo{font-size:12.5px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evlist>li{align-items:center;padding-block:9px}
.evtag{flex:none;font-family:var(--f-num);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px;min-width:44px;text-align:center;white-space:nowrap}
.evsrc{flex:none;font-size:11px;color:var(--muted)}
.evtitle{flex:1;min-width:0;overflow-wrap:anywhere}
/* research */
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rtop .sp{flex:1}
.plist{display:grid;gap:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard.hold{opacity:.85}
.phd{display:flex;align-items:center;gap:10px;min-width:0}
.pdot{flex:none;width:12px;height:12px;border-radius:4px;background:var(--pc)}
.ptitle{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;flex:1;min-width:0;overflow-wrap:anywhere}
.pstat{flex:none;font-size:12px;padding:3px 9px;border-radius:999px;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent)}
.pgoal{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.pprog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pprog .bar{flex:1;height:6px}
.pprog .bar i{background:var(--pc)}
.psub{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:2px 0 -4px}
.psub .sp{flex:1}
.mlist>li{align-items:center}
.mstat{flex:none;font:inherit;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 9px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--muted);min-width:56px}
.mstat.doing{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.mstat.done{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.mlist li.done .ttext{color:var(--muted);text-decoration:line-through}
.mdue{flex:none;font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.mdue.soon{color:var(--danger);font-weight:500}
.plogs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plog{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.plog:first-child{border-top:0}
.plog .pld{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.plog dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13.5px}
.plog dt{color:var(--muted);font-size:12px;padding-top:1px}
.plog dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.pmore{font:inherit;background:none;border:0;color:var(--accent);font-size:13px;padding:6px 0;cursor:pointer;text-align:left}
details.pdone summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
details.pdone .plist{margin-top:12px}
#tlwrap:empty{display:none}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl .hr:first-child{border-top:0}
.tl .hr span{position:absolute;left:10px;top:3px;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.tlev{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border-radius:8px;padding:3px 8px;overflow:hidden;font:inherit;font-size:12.5px;line-height:1.35;color:var(--ink);text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--ec,var(--accent)) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--ec,var(--accent)) 45%,transparent)}
.tlev:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* countdown */
.cdbox{display:flex;flex-wrap:wrap;gap:8px}
.cd{flex:1 1 150px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cd .cdt{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.cd .cdn{font-size:13px;color:var(--muted);white-space:nowrap}
.cd .cdn b{font-family:var(--f-num);font-size:22px;font-weight:500;color:var(--accent)}
.cd .cdd{grid-column:1/-1;font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
/* week timeline */
.wtl{display:flex;flex-direction:column;gap:8px}
.wtlhd{display:flex;align-items:center;gap:8px;min-height:30px}
.wtlhd .sp{flex:1}
.wgrid{display:grid;grid-template-columns:42px repeat(var(--n),minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wday{font:inherit;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.wday span{font-family:var(--f-num);font-size:15px;color:var(--ink)}
.wday.today span{color:var(--accent);font-weight:700}
.wday.sel{background:var(--accent-soft)}
.wday .wn{font-size:10px;color:var(--danger);font-style:normal;font-weight:700}
.wday:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.wcorner{border-bottom:1px solid var(--line)}
.wadl{border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;align-items:flex-start;justify-content:center;padding-top:5px}
.wad{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wadc{font:inherit;text-align:left;cursor:pointer;font-size:11px;line-height:1.3;padding:2px 5px;border-radius:5px;color:var(--ink);background:color-mix(in srgb,var(--ec) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--ec) 45%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wtimes{position:relative}
.wtimes span{position:absolute;right:5px;font-family:var(--f-num);font-size:10px;color:var(--muted)}
.wcol{position:relative;border-left:1px solid var(--line);cursor:copy}
.wcol.today{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.wcol .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.wcol .hl.half{border-top-style:dotted;opacity:.6}
.wev{font:inherit;box-sizing:border-box;position:absolute;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;cursor:pointer;text-align:left;border-radius:6px;padding:2px 4px;overflow:hidden;font-size:11px;line-height:1.25;color:var(--ink);
  background:color-mix(in srgb,var(--ec) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--ec) 50%,transparent)}
.wev .tm{display:block;font-family:var(--f-num);font-size:10px;color:var(--muted)}
.wev .tt{overflow-wrap:anywhere}
.wev:focus-visible,.wadc:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wnow{position:absolute;left:0;right:0;border-top:2px solid var(--danger);pointer-events:none}
.calchk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;cursor:pointer}
.calchk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.calchk .dot{margin-top:0}
.calchk small{color:var(--muted);font-size:11px}
.evinfo{display:flex;flex-direction:column;gap:6px;font-size:14px}
.evinfo .row2{display:flex;gap:10px;align-items:baseline}
.evinfo .k{flex:none;width:70px;font-size:12px;color:var(--muted)}
.tlev .tm{display:block;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.tlev.short{flex-direction:row;align-items:baseline}
.tlev.short .tm{display:inline;margin-right:6px}
.tlev .tt{overflow-wrap:anywhere}
.tlnow{position:absolute;left:46px;right:0;border-top:2px solid var(--danger);pointer-events:none}
.tlnow::before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.sun-tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:1px 6px}

.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.review.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.big{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1}
.big small{font-size:14px;color:var(--muted)}
.catrow{display:flex;flex-wrap:wrap;gap:6px}
.catrow .chip b{font-family:var(--f-num);font-weight:500}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;resize:vertical;line-height:1.6}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* month */
.gprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.gprog .bar{flex:1;height:5px;max-width:140px}
.dl-date{flex:none;width:64px;font-family:var(--f-num);font-size:13px;line-height:1.3}
.dl-date small{display:block;color:var(--muted);font-size:11px}
.left{flex:none;font-size:12px;font-family:var(--f-num);color:var(--muted)}
.left.soon{color:var(--danger);font-weight:500}
.past{opacity:.5}

/* tabs + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button svg{width:20px;height:20px;margin:2px 0 1px}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-family:var(--f-num);font-size:17px;font-weight:500;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:7;right:max(16px,calc(50% - 254px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 40%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.sheet h3{margin:0;font-size:17px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.sheet input[type=text],.sheet input[type=date],.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg .chip-btn[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc)}
.wkpick{display:flex;gap:6px;align-items:center}
.wkpick select{flex:1}
.wkpick button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;width:40px;height:42px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .sp{flex:1}
/* routine dial */
.dialcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.dialtop{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.dialtop b{color:var(--ink);font-weight:700}

  {const pids=new Set(b.projects.map(p=>p.id));

  ['notes','dnotes'].forEach(f=>{if(o[f]&&typeof o[f]==='object')Object.keys(o[f]).forEach(k=>{if(isDay(k)&&o[f][k])b[f][k]=String(o[f][k])})});

let view='today', sel=todayKey(), wkSel=monday(sel), moSel=sel.slice(0,7);
let loaded=false, dirty=false, timer=null, confirmCarry=false, confirmClear=false;
let sh=null; // sheet draft

/* ---------- storage: this device first, then Google Sheets ----------

   When a Sheets connection is set, changes are pushed after a short pause and the
   latest copy is pulled when the app opens or comes back to the front.
   `base` is the spreadsheet version this device last saw; the script refuses a save
   made on top of an older version, and the app then asks which copy to keep. */
const LK='planner-pwa-data-v1', CK='planner-pwa-conn-v1';
let base=null, conn=null, syncing=false, again=false, conflict=null, lastSync=null, connFlow=null;
function setStatus(t,err){const el=document.getElementById('status');el.textContent=t;el.classList.toggle('err',!!err)}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify({S,base,dirty}))}catch(e){setStatus('この端末に保存できませんでした（ストレージがいっぱいか、プライベートモードです）',true)}}
function loadLocal(){try{const raw=localStorage.getItem(LK);if(raw){const o=JSON.parse(raw);S=norm(o.S);base=o.base||null;dirty=!!o.dirty}}catch(e){}
  try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&c.url&&c.token)conn=c}catch(e){}}
function idleStatus(){
  if(conflict)return setStatus('別の端末でも変更されています。どちらを残すか選んでください',true);
  if(!conn)return setStatus('この端末にだけ保存中（設定でスプレッドシートにつなげます）');
  if(dirty)return setStatus(navigator.onLine?'未同期の変更があります':'オフライン・つながったら同期します');
  setStatus(lastSync?'同期済み '+lastSync:'スプレッドシートと接続済み');

function persist(rerender=true){

async function call(c,action,extra){

function errText(e){const k=e&&e.error;

    :k==='not_json'?'URLがスクリプトの公開URLではないようです（「ウェブアプリ」のURLを使ってください）'
    :k==='http'?'接続先がエラーを返しました（'+e.status+'）。公開の設定を確認してください'
    :k==='timeout'?'応答がありませんでした。通信状態を確認してください'
    :k==='network'?'接続できませんでした。URLと通信状態、公開範囲が「全員」になっているかを確認してください'

  if(d&&(!calList||own.some(c=>c.id===d)))return d;const p=own.find(c=>c.primary)||own[0];return p?p.id:''}

  if(calErr)return '<p class="note" style="margin:8px 0 0">カレンダーの予定を読み込めませんでした（前回の内容を表示しています）。</p>';
  return ''}
function calWk(){return view==='week'?wkSel:monday(sel)}
function maybeCal(){const wk=calWk();if((view==='today'||view==='week')&&conn&&navigator.onLine&&!calBusy[wk]&&(!calAt[wk]||Date.now()-calAt[wk]>6e5))fetchCal(wk)}
function calReset(){cal={};calAt={};try{localStorage.removeItem(CALK)}catch(e){}}
async function fetchCal(wk){calBusy[wk]=1;
  try{const ids=calSelIds();const j=await call(conn,'events',ids?{from:wk,to:addDays(wk,7),cals:ids}:{from:wk,to:addDays(wk,7)});
    weekDays(wk).forEach(d=>{cal[d]=[]});(j.events||[]).forEach(e=>{if(cal[e.date])cal[e.date].push(normEv(e))});
    calAt[wk]=Date.now();calErr=null;
    const keep=new Set(Object.keys(calAt).sort().slice(-6));Object.keys(calAt).forEach(k=>{if(!keep.has(k)){delete calAt[k];weekDays(k).forEach(d=>delete cal[d])}});
    try{localStorage.setItem(CALK,JSON.stringify({cal,calAt}))}catch(e){}
  }catch(e){calErr=e&&e.error==='bad_action'?'old':'err';calAt[wk]=Date.now()}
  finally{delete calBusy[wk];drawEv();if(view==='week'&&wkSel===wk)render()}}
async function fetchCalList(){if(!conn||calListBusy)return;calListBusy=true;
  try{const j=await call(conn,'calendars',{});calList=(j.calendars||[]).map(c=>({id:String(c.id),name:String(c.name||c.id),color:safeColor(c.color),own:!!c.own,shown:c.shown!==false,primary:!!c.primary}));calListErr=null;
    try{localStorage.setItem(CLK,JSON.stringify(calList))}catch(e){}}
  catch(e){calListErr=e&&e.error==='bad_action'?'old':'err'}
  finally{calListBusy=false;if(view==='settings')render();if(sh&&sh.mode==='gev')renderSheet()}}
function calErrText(e){const k=e&&e.error;
  return k==='recurring'?'繰り返しの予定は、Googleカレンダーで変更してください。'
    :k==='forbidden'?'この予定は変更できません（自分が作成した予定ではない可能性があります）。'
    :k==='not_found'?'予定が見つかりませんでした。すでに削除されたか、別のカレンダーに移された可能性があります。'
    :k==='bad_time'?'終了時刻は開始時刻より後にしてください。'
    :k==='bad_input'?'日付と時刻の入力を確認してください。'
    :k==='bad_action'?'スプレッドシートのスクリプトを最新版にすると、カレンダーを変更できるようになります。'
    :errText(e)}
async function calWrite(action,ev){
  if(!conn)return{err:'スプレッドシートとつないでいないため、カレンダーを変更できません。'};
  if(!navigator.onLine)return{err:'オフラインのため、カレンダーを変更できません。つながってからもう一度試してください。'};
  try{const j=await call(conn,action,{event:ev});return{ok:true,j}}catch(e){return{err:calErrText(e)}}}
function calChanged(days){const wks=new Set(days.filter(Boolean).map(d=>monday(d)));wks.add(calWk());wks.forEach(w=>{delete calAt[w]});fetchCal(calWk())}
function boot(){loadLocal();loaded=true;render();idleStatus();if(conn)sync();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(view==='today')drawDial();sync();maybeCal()}});
  window.addEventListener('online',()=>{sync();maybeCal()});window.addEventListener('offline',()=>idleStatus());
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- helpers ---------- */
const chip=k=>{const c=catOf(k);return `<span class="chip cc-${c.c}">${esc(c.n)}</span>`};
const goalById=id=>S.goals.find(g=>g.id===id);
const sortT=a=>a.slice().sort((x,y)=>(x.done-y.done));
const tasksOn=k=>sortT(S.tasks.filter(t=>t.date===k));
const unsched=wk=>sortT(S.tasks.filter(t=>!t.date&&t.wk===wk));
const tasksOfWeek=wk=>S.tasks.filter(t=>(t.date?monday(t.date):t.wk)===wk);
const hasSample=()=>[...S.tasks,...S.goals,...S.dls].some(x=>String(x.t).startsWith('例：'));
const isEmpty=()=>!S.tasks.length&&!S.goals.length&&!S.dls.length;

function taskRow(t,opts={}){
  const g=t.goal?goalById(t.goal):null;
  return `<li class="${t.done?'done':''}">
    <button class="check" data-act="toggle" data-id="${t.id}" aria-label="${t.done?'未完了に戻す':'完了にする'}" aria-pressed="${!!t.done}">${CHECK}</button>
    <button class="tbody" data-act="edit" data-id="${t.id}">
      <span class="ttext">${esc(t.t)}</span>
      <span class="meta">${t.exp?'<span class="tag-exp">実験</span>':''}${chip(t.cat)}${g?`<span class="goal-ref">→ ${esc(g.t)}</span>`:''}</span>${t.memo?`<span class="tmemo">${esc(t.memo)}</span>`:''}
    </button>
    ${opts.pull?`<button class="side-btn" data-act="totoday" data-id="${t.id}">今日やる</button>`:''}
  </li>`;
}
const list=(arr,opts)=>`<ul class="list">${arr.map(t=>taskRow(t,opts)).join('')}</ul>`;
const sampleBox=()=>isEmpty()?`<div class="empty"><span>まだ何も入っていません。使い方の例を入れて試すこともできます（「例：」の付いた項目はあとでまとめて消せます）。</span><button class="btn ghost" data-act="sample">例を入れて試す</button></div>`:'';

/* ---------- routine dial ---------- */
const RCOL=['#85B7EB','#F0997B','#5DCAA5','#FAC775','#C9C7BE','#AFA9EC','#ED93B1','#97C459','#F09595','#7FD3DD'];
const INK={'#85B7EB':'#042C53','#F0997B':'#4A1B0C','#5DCAA5':'#04342C','#FAC775':'#412402','#C9C7BE':'#2C2C2A','#AFA9EC':'#26215C','#ED93B1':'#4B1528','#97C459':'#173404','#F09595':'#501313','#7FD3DD':'#06343A'};
const PATN={wd:'平日（月〜土）',sun:'日曜'};
const DC=200,DR=168,DRI=64,SNAP=15;
const mnorm=m=>((m%1440)+1440)%1440;
const hm=m=>{m=mnorm(m);return pad(Math.floor(m/60))+':'+pad(m%60)};
const toMin=v=>{if(!v)return null;const[a,b]=v.split(':').map(Number);return isNaN(a)?null:a*60+(b||0)};
const rdur=p=>((p.e-p.s+1440)%1440)||1440;
const fmtDur=m=>{const h=Math.floor(m/60),mm=m%60;return h&&mm?`${h}h${mm}m`:h?`${h}h`:`${mm}m`};
const patKey=k=>parse(k).getDay()===0?'sun':'wd';
const curPlans=()=>S.routine[patKey(sel)];
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let rsel=null,drag=null,confirmCopy=false;
let dialOpen=true;try{dialOpen=localStorage.getItem('planner-dial-open')!=='0'}catch(e){}
function dpt(m,r){const a=m/1440*2*Math.PI-Math.PI/2;return[(DC+r*Math.cos(a)).toFixed(2),(DC+r*Math.sin(a)).toFixed(2)]}
function arcPath(s,e,R,r){let d=((e-s+1440)%1440)||1440;if(d>=1440)d=1439.9;const e2=s+d,big=d>720?1:0;
  const[a,b]=dpt(s,R),[c,dd]=dpt(e2,R),[f,g]=dpt(e2,r),[h,i]=dpt(s,r);
  return`M${a} ${b}A${R} ${R} 0 ${big} 1 ${c} ${dd}L${f} ${g}A${r} ${r} 0 ${big} 0 ${h} ${i}Z`}
function nowInfo(plans,nm){let cur=null,next=null,best=1e9;
  plans.forEach(p=>{if((nm-p.s+1440)%1440<rdur(p))cur=p;const u=(p.s-nm+1440)%1440;if(u>0&&u<best){best=u;next=p}});return{cur,next}}
function overlap(plans){const used=new Uint8Array(1440);let over=0;plans.forEach(p=>{for(let k=0;k<rdur(p);k++){const i=(p.s+k)%1440;if(used[i])over++;used[i]=1}});return over}
const short=(s,n)=>s.length>n?s.slice(0,n)+'…':s;

function dialSVG(){
  const plans=curPlans();if(rsel!=null&&!plans[rsel])rsel=null;
  const isToday=sel===todayKey(),nm=nowMin();
  let h=`<circle cx="${DC}" cy="${DC}" r="${(DR+DRI)/2}" fill="none" style="stroke:var(--line)" stroke-width="${DR-DRI}"/>`;
  plans.forEach((p,i)=>{
    const d=rdur(p),rm=(DR+DRI)/2,[x,y]=dpt(p.s+d/2,rm),arcLen=rm*2*Math.PI*d/1440,ink=INK[p.c]||'#1b1e26';
    let lab='';
    if(d>=60&&arcLen>=34){
      const showName=p.name.length*12.5<=Math.max(arcLen*.95,(DR-DRI)*.9)&&d>=75;
      lab=showName?`<text x="${x}" y="${+y-8}" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="${ink}">${esc(p.name)}</text><text x="${x}" y="${+y+9}" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="DM Mono, monospace" fill="${ink}">${fmtDur(d)}</text>`
        :`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="DM Mono, monospace" fill="${ink}">${fmtDur(d)}</text>`;
    }
    h+=`<g class="seg${rsel===i?' sel':''}" data-role="seg" data-i="${i}" tabindex="0" role="button" aria-label="${esc(p.name)} ${hm(p.s)}から${hm(p.e)}"${rsel!=null&&rsel!==i?' opacity="0.4"':''}><path d="${arcPath(p.s,p.e,DR,DRI)}" fill="${p.c}" style="stroke:var(--surface)" stroke-width="2" stroke-linejoin="round"/>${lab}</g>`;
  });
  for(let k=0;k<24;k++){const m=k*60,major=k%6===0;const[x1,y1]=dpt(m,DR+2),[x2,y2]=dpt(m,DR+(major?9:6)),[tx,ty]=dpt(m,DR+(major?20:18));
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--muted)" stroke-width="${major?1.5:1}"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="${major?13:10}" font-weight="${major?700:400}" font-family="DM Mono, monospace" style="fill:var(${major?'--ink':'--muted'})">${k}</text>`}
  if(isToday&&rsel==null){const[a,b]=dpt(nm,DRI-4),[c,d]=dpt(nm,DR+3);
    h+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/><circle cx="${c}" cy="${d}" r="3.5" style="fill:var(--ink)" pointer-events="none"/>`}
  let top,big,sub='';
  if(rsel!=null){const p=plans[rsel];top=short(p.name,8);big=fmtDur(rdur(p));sub=hm(p.s)+'–'+hm(p.e);
    [['hs',p.s],['he',p.e]].forEach(([role,m])=>{const[x,y]=dpt(m,DR);
      h+=`<g class="handle" data-role="${role}" data-i="${rsel}"><circle cx="${x}" cy="${y}" r="22" fill="transparent"/><circle cx="${x}" cy="${y}" r="10" style="fill:var(--surface);stroke:var(--accent)" stroke-width="3"/></g>`})}
  else if(isToday){const{cur}=nowInfo(plans,nm);top=hm(nm);big=cur?short(cur.name,6):'空き時間';sub=cur?'〜'+hm(cur.e):''}
  else{top=PATN[patKey(sel)];big=wdOf(sel)+'曜日';}
  h+=`<text x="${DC}" y="${DC-(sub?20:10)}" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-family="DM Mono, Zen Kaku Gothic New, sans-serif" style="fill:var(--muted)" pointer-events="none">${esc(top)}</text>`;
  h+=`<text x="${DC}" y="${DC+(sub?0:8)}" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" style="fill:var(--ink)" pointer-events="none">${esc(big)}</text>`;
  if(sub)h+=`<text x="${DC}" y="${DC+20}" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="DM Mono, monospace" style="fill:var(--muted)" pointer-events="none">${esc(sub)}</text>`;
  return h;
}
function dialBar(){
  const plans=curPlans();
  if(!plans.length)return `<div class="dialbar"><span class="nm note">${PATN[patKey(sel)]}のルーティンはまだありません。下の「＋ 枠を追加」で追加するか、設定からデータを読み込んでください。</span></div>`;
  if(rsel!=null&&plans[rsel]){const p=plans[rsel];
    return `<div class="dialbar selected"><span class="dot" style="background:${p.c}"></span><span class="nm">${esc(p.name)} <span class="mono">${hm(p.s)}–${hm(p.e)}</span></span><button class="side-btn" data-act="bedit">編集</button><button class="side-btn" data-act="bdone">完了</button></div>`}
  if(sel===todayKey()){const{cur,next}=nowInfo(plans,nowMin());
    return `<div class="dialbar">${cur?`<span class="dot" style="background:${cur.c}"></span><span class="nm">いま <b>${esc(cur.name)}</b> <span class="mono">〜${hm(cur.e)}</span></span>`:'<span class="nm">いまは空き時間です</span>'}${next?`<span class="note">次 <span class="mono">${hm(next.s)}</span> ${esc(next.name)}</span>`:''}</div>`}
  return '';
}
function dialList(){
  const plans=curPlans().map((p,i)=>({...p,i})).sort((a,b)=>a.s-b.s);
  if(!plans.length)return '';
  return plans.map(p=>`<li class="${rsel===p.i?'on':''}" data-act="blk" data-i="${p.i}"><span class="dot" style="background:${p.c}"></span><span class="mono">${hm(p.s)}–${hm(p.e)}</span><span class="rname">${esc(p.name)}</span><button type="button" class="rrow" data-act="blk" data-i="${p.i}" aria-label="${esc(p.name)}を編集"><span class="rdur">${fmtDur(rdur(p))}</span></button></li>`).join('');
}
function dialFoot(){
  const plans=curPlans(),over=overlap(plans);let f='';
  if(over)f+=`<span class="warnline">時間の重なり ${fmtDur(over)}</span>`;
  if(patKey(sel)==='sun')f+=confirmCopy?`<span>日曜の枠を平日の内容で置き換えます。</span><button class="side-btn" data-act="copy-yes">置き換える</button><button class="side-btn" data-act="copy-no">やめる</button>`
    :`<button class="linkbtn" data-act="copywd">平日の枠を日曜にコピー</button>`;
  f+=`<button class="btn ghost" data-act="addblock">＋ 枠を追加</button>`;
  return f;
}
function dialCard(){
  return `<section class="dialcard"><div class="dialtop"><span>ルーティン · <b>${PATN[patKey(sel)]}</b></span><span class="sp"></span>
    <button class="linkbtn" data-act="dialfold" aria-expanded="${dialOpen}">${dialOpen?'たたむ':'ひらく'}</button></div>
    <svg id="dial" viewBox="0 0 400 400" role="img" aria-label="24時間のルーティン" ${dialOpen?'':'hidden'}>${dialSVG()}</svg>
    <div id="dialbar">${dialBar()}</div>
    <ul class="list rlist" id="diallist" ${dialOpen&&curPlans().length?'':'hidden'}>${dialList()}</ul>
    <div class="dialfoot" id="dialfoot" ${dialOpen?'':'hidden'}>${dialFoot()}</div></section>`;
}
function drawDial(){const s=document.getElementById('dial');if(!s)return;s.innerHTML=dialSVG();
  document.getElementById('dialbar').innerHTML=dialBar();document.getElementById('dialfoot').innerHTML=dialFoot();
  const l=document.getElementById('diallist');if(l){l.innerHTML=dialList();l.hidden=!(dialOpen&&curPlans().length)}}

/* ---------- views ---------- */
function renderToday(){
  const t=todayKey();const d=parse(sel);
  setHead(`${d.getFullYear()} · 第${isoWeek(sel)}週${sel===t?' · 今日':''}`,`${d.getMonth()+1}月${d.getDate()}日（${wdOf(sel)}）`,
    `<button data-act="day" data-n="-1" aria-label="前の日">‹</button>${sel!==t?'<button data-act="day" data-n="0">今日</button>':''}<button data-act="day" data-n="1" aria-label="次の日">›</button>`);
  const items=tasksOn(sel);const done=items.filter(x=>x.done).length;
  const pull=unsched(monday(sel)).filter(x=>!x.done);
  const a=cdSection()+evSection()+`<div id="tlwrap">${tlSection()}</div>`+dialCard();let h='';
  h+=`<section><h2>この日にやること<span class="cnt">${done}/${items.length}</span><span class="sp"></span>${items.length>3?'<span class="note">3つ程度に絞ると回しやすいです</span>':''}</h2>`;
  h+=items.length?list(items):`<div class="empty">この日のタスクはまだありません。右下の＋で追加するか、下の「今週中にやること」から選んでください。</div>`;
  h+=`</section>`;
  h+=`<section><h2><label for="f-dnote">この日のメモ</label></h2><textarea id="f-dnote" style="background:var(--surface)" placeholder="気づいたこと、実験の条件、明日に回すことなど">${esc(S.dnotes[sel]||'')}</textarea></section>`;
  if(pull.length)h+=`<section><h2>今週中にやること（日付未定）<span class="cnt">${pull.length}</span></h2>${list(pull,{pull:true})}</section>`;
  h+=sampleBox();
  setTimeout(maybeCal,0);
  return `<div class="cols c-today"><div class="col col-a">${a}</div><div class="col col-b">${h}</div></div>`;
}
function weekDls(){
  const from=wkSel,to=addDays(wkSel,21),t=todayKey();
  const ds=S.dls.filter(d=>d.date>=from&&d.date<to).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=ds.map(d=>{const n=dayDiff(t,d.date),lbl=n<0?'終了':n===0?'今日':`あと${n}日`;
    return `<li class="${n<0?'past':''}"><span class="dl-date">${md(d.date)}<small>（${wdOf(d.date)}）</small></span><button class="tbody" data-act="dledit" data-id="${d.id}"><span class="ttext">${esc(d.t)}</span></button><span class="left ${n>=0&&n<=7?'soon':''}">${lbl}</span></li>`}).join('');
  return `<section><h2>締め切り<span class="cnt">${ds.length||''}</span><span class="note" style="font-weight:400">今週から3週間</span><span class="sp"></span><button class="linkbtn" data-act="adddl">＋ 追加</button></h2>
    ${rows?`<ul class="list">${rows}</ul>`:'<div class="mini-empty">この3週間の締め切りはありません。</div>'}</section>`;
}
/* ---------- week view: a timeline of Google Calendar events (3 days on a phone, 7 on a wide screen) ---------- */
const WK_PX=40; // height of one hour
let wkPage=null,wkDaySel=null;
const isNarrow=()=>{try{return matchMedia('(max-width: 899.98px)').matches}catch(e){return false}};
function weekGrid(vis,narrow,start){
  const t=todayKey(),nm=nowMin(),cols=vis.map(d=>layoutCols(timedOf(d)));
  const all=cols.flat();let h0=8,h1=20;
  if(all.length){h0=Math.min(h0,Math.floor(Math.min(...all.map(e=>e.a))/60));h1=Math.max(h1,Math.ceil(Math.max(...all.map(e=>e.b))/60))}
  h0=Math.max(0,h0);h1=Math.min(24,h1);
  const H=(h1-h0)*WK_PX,y=m=>(m-h0*60)*WK_PX/60;
  const ad=vis.map(d=>calFor(d).map((e,i)=>({...e,_i:i})).filter(e=>e.allDay)),anyAd=ad.some(x=>x.length);
  const dl=vis.map(d=>S.dls.filter(x=>x.date===d).length);
  let g=`<div class="wgrid" style="--n:${vis.length}"><div class="wcorner"></div>`;
  g+=vis.map((d,i)=>`<button class="wday${d===t?' today':''}${d===wkDaySel?' sel':''}" data-act="wkday" data-d="${d}" aria-pressed="${d===wkDaySel}" aria-label="${md(d)}（${wdOf(d)}）のタスクを表示"><b>${wdOf(d)}</b><span>${parse(d).getDate()}</span>${dl[i]?`<em class="wn">締切${dl[i]>1?dl[i]:''}</em>`:''}</button>`).join('');
  if(anyAd){g+=`<div class="wadl">終日</div>`+ad.map((x,i)=>`<div class="wad">${x.map(e=>`<button class="wadc" data-act="gevopen" data-d="${vis[i]}" data-i="${e._i}" style="--ec:${e.color||'var(--accent)'}" title="${esc(e.t)}">${esc(e.t)}</button>`).join('')}</div>`).join('')}
  g+=`<div class="wtimes" style="height:${H}px">`;for(let k=h0;k<h1;k++)g+=`<span style="top:${y(k*60)+2}px">${k}:00</span>`;g+=`</div>`;
  vis.forEach((d,i)=>{let c=`<div class="wcol${d===t?' today':''}" data-act="wslot" data-d="${d}" data-h0="${h0}" style="height:${H}px" aria-label="${md(d)}の空いている時間をタップすると予定を追加">`;
    for(let k=h0;k<h1;k++){c+=`<div class="hl" style="top:${y(k*60)}px"></div><div class="hl half" style="top:${y(k*60+30)}px"></div>`}
    cols[i].forEach(e=>{const top=y(e.a),ht=Math.max(18,y(e.b)-top-2);
      c+=`<button class="wev" data-act="gevopen" data-d="${d}" data-i="${e._i}" style="--ec:${e.color||'var(--accent)'};top:${top+1}px;height:${ht}px;left:calc(100% * ${e.col}/${e.n} + 1px);width:calc(100% / ${e.n} - 3px)" title="${esc(e.s)}${e.e?'–'+esc(e.e):''} ${esc(e.t)}">${ht>=30?`<span class="tm">${esc(e.s)}</span>`:''}<span class="tt">${esc(e.t)}</span></button>`});
    if(d===t&&nm>=h0*60&&nm<=h1*60)c+=`<div class="wnow" style="top:${y(nm)}px" aria-hidden="true"></div>`;
    g+=c+`</div>`});
  g+=`</div>`;
  const nav=narrow?`<button class="side-btn" data-act="wkpage" data-n="-1" ${start===0?'disabled':''} aria-label="前の3日">‹</button><span class="mono" style="color:var(--muted)">${md(vis[0])}–${md(vis[vis.length-1])}</span><button class="side-btn" data-act="wkpage" data-n="1" ${start>=4?'disabled':''} aria-label="次の3日">›</button>`:'';
  return `<section class="wtl"><div class="wtlhd">${nav}<span class="sp"></span>${calOK()?`<button class="linkbtn" data-act="gevnew" data-d="${wkDaySel}">＋ 予定を追加</button>`:''}</div>${g}
    ${conn?calNote():'<p class="note" style="margin:0">設定でスプレッドシートとつなぐと、Googleカレンダーの予定がここに表示されます。</p>'}</section>`;
}
function renderWeek(){

  if(!wkDaySel||!days.includes(wkDaySel))wkDaySel=days.includes(t)?t:days[0];
  const narrow=isNarrow();let start=0,n=7;
  if(narrow){n=3;if(wkPage==null||wkPage<0||wkPage>4){const ti=days.indexOf(wkDaySel);wkPage=Math.max(0,Math.min(4,ti-1))}start=wkPage}

function sheetErr(msg){const e=document.getElementById('sh-err');if(e){e.textContent=msg;e.hidden=false}}
function saveSheet(){if(sh&&sh.mode==='gev'){if(!sh.ro&&!sh.busy)gevSave();return}readSheet();const text=(sh.t||'').trim();
  if(sh.mode==='proj'){if(!text){sheetErr('テーマ名を入力してください。');return}
    const o={id:sh.id||uid(),t:text,goal:(sh.goal||'').trim(),status:sh.status,c:sh.c},i=S.projects.findIndex(x=>x.id===o.id);i>=0?S.projects[i]=o:S.projects.push(o);
    sh=null;renderSheet();persist();return}
  if(sh.mode==='mile'){if(!text){sheetErr('内容を入力してください。');return}
    const o={id:sh.id||uid(),pid:sh.pid,t:text,due:isDayK(sh.due)?sh.due:'',status:sh.status,cd:!!sh.cd,memo:(sh.memo||'').trim()},i=S.miles.findIndex(x=>x.id===o.id);i>=0?S.miles[i]=o:S.miles.push(o);
    sh=null;renderSheet();persist();return}
  if(sh.mode==='plog'){const o={id:sh.id||uid(),pid:sh.pid,date:sh.date};LOGF.forEach(([k])=>{o[k]=(sh[k]||'').trim()});
    if(!projOf(o.pid)){sheetErr('テーマを選んでください。');return}if(!isDayK(o.date)){sheetErr('日付を入力してください。');return}
    if(!LOGF.some(([k])=>o[k])){sheetErr('どれか1つの欄に書いてください。');return}
    const i=S.plogs.findIndex(x=>x.id===o.id);i>=0?S.plogs[i]=o:S.plogs.push(o);logOpen.add(o.pid);
    sh=null;renderSheet();persist();return}
  if(sh.mode==='ev'||sh.mode==='mev'){if(!text){sheetErr('内容を入力してください。');return}if(!isDayK(sh.date)){sheetErr('日付を入力してください。');return}
    if(sh.end&&!isDayK(sh.end))sh.end='';if(sh.mode==='mev'&&sh.end&&sh.end<sh.date){sheetErr('終了日は開始日と同じか、それより後にしてください。');return}
    const arr=sh.mode==='mev'?S.mevents:S.events,o=sh.mode==='mev'?{id:sh.id||uid(),date:sh.date,end:sh.end&&sh.end>sh.date?sh.end:'',t:text,memo:(sh.memo||'').trim(),cd:!!sh.cd}:{id:sh.id||uid(),date:sh.date,t:text,memo:(sh.memo||'').trim()};
    const i=arr.findIndex(x=>x.id===o.id);i>=0?arr[i]=o:arr.push(o);
    sh=null;renderSheet();persist();return}
  if(sh.mode==='cat'){if(!text){sheetErr('名前を入力してください。');return}
    const cs=cats().map(c=>({...c}));if(cs.some(c=>c.n===text&&c.k!==sh.id)){sheetErr('同じ名前のカテゴリがあります。');return}
    const i=cs.findIndex(c=>c.k===sh.id);if(i>=0)cs[i]={...cs[i],n:text,c:sh.c};else cs.push({k:uid(),n:text,c:sh.c});
    S.cats=cs;sh=null;renderSheet();persist();return}
  if(!text){sheetErr(sh.mode==='block'?'名前を入力してください。':'内容を入力してください。');return}
  if(sh.mode==='block'){
    if(sh.s==null||sh.e==null){sheetErr('開始と終了の時刻を入力してください。');return}
    if(sh.s===sh.e){sheetErr('開始と終了が同じです。どちらかをずらしてください。');return}
    const plans=S.routine[sh.pat],o={name:text,s:sh.s,e:sh.e,c:sh.c};
    if(sh.idx!=null&&plans[sh.idx])plans[sh.idx]=o;else{plans.push(o);if(patKey(sel)===sh.pat)rsel=plans.length-1}
    sh=null;renderSheet();persist();return}
  if(sh.mode==='task'){const o={id:sh.id||uid(),t:text,cat:sh.cat,exp:!!sh.exp,date:sh.date||null,wk:sh.date?monday(sh.date):sh.wk,goal:sh.goal||null,done:!!sh.done,memo:(sh.memo||'').trim()};
    const i=S.tasks.findIndex(x=>x.id===o.id);i>=0?S.tasks[i]=o:S.tasks.push(o)}
  else if(sh.mode==='goal'){const o={id:sh.id||uid(),t:text,cat:sh.cat,mo:sh.mo,done:!!sh.done,memo:(sh.memo||'').trim()};const i=S.goals.findIndex(x=>x.id===o.id);i>=0?S.goals[i]=o:S.goals.push(o)}
  else{if(!sh.date)return;const o={id:sh.id||uid(),t:text,date:sh.date};const i=S.dls.findIndex(x=>x.id===o.id);i>=0?S.dls[i]=o:S.dls.push(o)}
  sh=null;renderSheet();persist();}
function delSheet(){if(sh.mode==='gev'){if(!sh.busy)gevDel();return}
  if(sh.mode==='proj'){if(!sh.armed){readSheet();sh.armed=true;renderSheet();return}
    const k=sh.id;S.projects=S.projects.filter(x=>x.id!==k);S.miles=S.miles.filter(x=>x.pid!==k);S.plogs=S.plogs.filter(x=>x.pid!==k);sh=null;renderSheet();persist();return}
  if(sh.mode==='mile'||sh.mode==='plog'){const f=sh.mode==='mile'?'miles':'plogs';S[f]=S[f].filter(x=>x.id!==sh.id);sh=null;renderSheet();persist();return}
  if(sh.mode==='ev'||sh.mode==='mev'){const f=sh.mode==='mev'?'mevents':'events';S[f]=S[f].filter(x=>x.id!==sh.id);sh=null;renderSheet();persist();return}
  if(sh.mode==='cat'){if(!sh.armed){readSheet();sh.armed=true;renderSheet();return}
    const k=sh.id;S.cats=cats().filter(c=>c.k!==k);S.tasks.forEach(t=>{if(t.cat===k)t.cat='etc'});S.goals.forEach(g=>{if(g.cat===k)g.cat='etc'});sh=null;renderSheet();persist();return}
  if(sh.mode==='block'){S.routine[sh.pat].splice(sh.idx,1);rsel=null;sh=null;renderSheet();persist();return}
  if(sh.mode==='task')S.tasks=S.tasks.filter(x=>x.id!==sh.id);
  else if(sh.mode==='goal'){S.goals=S.goals.filter(x=>x.id!==sh.id);S.tasks.forEach(t=>{if(t.goal===sh.id)t.goal=null})}
  else S.dls=S.dls.filter(x=>x.id!==sh.id);sh=null;renderSheet();persist()}

function exportText(){return JSON.stringify({app:'planner',v:1,exportedAt:new Date().toISOString(),data:S},null,1)}

  S.tasks.push({id:uid(),t:'例：条件検討の実験',cat:'res',exp:true,date:t,wk,goal:g1,done:false},
    {id:uid(),t:'例：論文を1本読む',cat:'res',exp:false,date:t,wk,goal:null,done:true},
    {id:uid(),t:'例：英語のリスニング',cat:'eng',exp:false,date:t,wk,goal:g3,done:false},
    {id:uid(),t:'例：ラボミーティングの資料作成',cat:'res',exp:false,date:null,wk,goal:null,done:false},

function clearSample(){const ex=x=>String(x.t).startsWith('例：');const gids=new Set(S.goals.filter(ex).map(g=>g.id));
  S.goals=S.goals.filter(g=>!ex(g));S.dls=S.dls.filter(d=>!ex(d));S.tasks=S.tasks.filter(t=>!ex(t));S.tasks.forEach(t=>{if(gids.has(t.goal))t.goal=null});confirmClear=false;persist()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,n=Number(el.dataset.n);
  if(a==='sh-bg'){if(e.target===el){sh=null;renderSheet()}return}
  if(!loaded&&!a.startsWith('sh-'))return;
  switch(a){
    case 'cf-server':resolveConflict(true);break;
    case 'cf-local':resolveConflict(false);break;
    case 'set-connect':{const u=document.getElementById('f-url').value,tk=document.getElementById('f-token').value;
      setUI={msg:'接続を確認しています…',err:false,busy:true};render();
      connect(u,tk).then(r=>{setUI={msg:r.msg,err:!!r.err,choose:!!r.choose};render()});break}
    case 'set-use-server':finishConnect(true);setUI={msg:'スプレッドシートのデータを読み込みました。'};render();break;
    case 'set-use-local':finishConnect(false);setUI={msg:'この端末のデータでスプレッドシートを上書きします。'};render();break;
    case 'set-cancel':connFlow=null;setUI={};render();break;
    case 'set-sync':sync();break;
    case 'set-disc':setUI={confirmDisc:true};render();break;
    case 'set-disc-no':setUI={};render();break;
    case 'set-disc-yes':disconnect();setUI={msg:'接続を解除しました。データはこの端末に残っています。'};render();break;
    case 'ex-copy':{const ta=document.getElementById('f-export'),msg=document.getElementById('ex-msg');
      const fb=()=>{ta.focus();ta.select();msg.textContent='全体を選択しました。コピーしてください。'};
      try{navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent='コピーしました。'},fb)}catch(_){fb()}break}
    case 'ex-file':{try{const b=new Blob([exportText()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='planner-data-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
      document.getElementById('ex-msg').textContent='ファイルを保存しました。'}catch(_){document.getElementById('ex-msg').textContent='保存できませんでした。「コピー」を使ってください。'}break}
    case 'im-pick':document.getElementById('f-imfile').click();break;
    case 'im-check':{const v=document.getElementById('f-import').value;let o=null;try{o=JSON.parse(v)}catch(_){}
      const d=o&&(o.app==='planner'&&o.data?o.data:o);
      if(!d||typeof d!=='object'||!('tasks' in d||'goals' in d||'routine' in d)){imUI={text:v,msg:'読み込める形式ではありません。書き出した内容をそのまま貼り付けてください。',err:true};render();break}
      const n=norm(d);imUI={text:v,data:n,msg:`タスク${n.tasks.length}件・目標${n.goals.length}件・締め切り${n.dls.length}件・ルーティン${n.routine.wd.length+n.routine.sun.length}枠が見つかりました。今のデータを置き換えます。`};render();break}
    case 'im-yes':if(imUI.data){S=imUI.data;imUI={msg:'読み込みました。'};persist()}break;
    case 'im-no':imUI={};render();break;
    case 'blk':rsel=+el.dataset.i;drawDial();openBlock(rsel);break;
    case 'addblock':openBlock(null);break;

    case 'dialfold':dialOpen=!dialOpen;rsel=null;try{localStorage.setItem('planner-dial-open',dialOpen?'1':'0')}catch(_){}render();break;
    case 'copywd':confirmCopy=true;drawDial();break;
    case 'copy-no':confirmCopy=false;drawDial();break;
    case 'copy-yes':S.routine.sun=S.routine.wd.map(p=>({...p}));confirmCopy=false;rsel=null;persist();break;
    case 'addproj':openProj(null);break;
    case 'pedit':openProj(projOf(id));break;
    case 'addmile':openMile(null,id);break;
    case 'medit':openMile(S.miles.find(x=>x.id===id));break;
    case 'mstat':{const m=S.miles.find(x=>x.id===id);if(m){m.status=MNEXT[m.status];persist()}break}
    case 'addlog':openLog(null,id);break;
    case 'ledit':openLog(S.plogs.find(x=>x.id===id));break;

    case 'sh-pstat':readSheet();sh.status=el.dataset.v;renderSheet();break;
    case 'sh-mstat':readSheet();sh.status=el.dataset.v;renderSheet();break;
    case 'tlfold':tlOpen=!tlOpen;try{localStorage.setItem('planner-tl-open',tlOpen?'1':'0')}catch(_){}drawTl();break;
    case 'addmev':{const t=todayKey();sh={mode:'mev',id:null,t:'',date:moSel===t.slice(0,7)?t:moSel+'-01',end:'',memo:''};renderSheet();break}
    case 'mevedit':{const e=S.mevents.find(x=>x.id===id);if(e){sh={mode:'mev',...JSON.parse(JSON.stringify(e))};renderSheet()}break}
    case 'addev':openEv(null);break;
    case 'evedit':openEv(S.events.find(x=>x.id===id));break;
    case 'addcat':openCat(null);break;
    case 'catedit':openCat(el.dataset.k);break;
    case 'catmove':{const cs=cats().map(c=>({...c})),i=cs.findIndex(c=>c.k===el.dataset.k),j=i+n;if(i<0||j<0||j>=cs.length)break;[cs[i],cs[j]]=[cs[j],cs[i]];S.cats=cs;persist();break}
    case 'sh-ccol':readSheet();sh.c=Number(el.dataset.v);sh.armed=false;renderSheet();break;
    case 'sh-col':readSheet();sh.c=el.dataset.v;renderSheet();break;
    case 'tab':view=el.dataset.v;confirmCarry=confirmClear=confirmCopy=false;rsel=null;if(view==='week')wkSel=monday(sel);if(view==='month')moSel=sel.slice(0,7);render();window.scrollTo(0,0);break;
    case 'day':sel=n===0?todayKey():addDays(sel,n);rsel=null;confirmCopy=false;render();break;
    case 'wk':wkPage=null;wkDaySel=null;wkSel=n===0?monday(todayKey()):addDays(wkSel,7*n);sel=wkSel<=todayKey()&&todayKey()<=addDays(wkSel,6)?todayKey():wkSel;confirmCarry=false;render();break;
    case 'mo':moSel=n===0?todayKey().slice(0,7):moAdd(moSel,n);render();break;
    case 'toggle':{const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;persist()}break}
    case 'gtoggle':{const g=S.goals.find(x=>x.id===id);if(g){g.done=!g.done;persist()}break}
    case 'totoday':{const t=S.tasks.find(x=>x.id===id);if(t){t.date=sel;t.wk=monday(sel);persist()}break}
    case 'edit':openTask(S.tasks.find(x=>x.id===id));break;
    case 'gedit':openGoal(S.goals.find(x=>x.id===id));break;
    case 'dledit':openDl(S.dls.find(x=>x.id===id));break;
    case 'addtask':openTask(null,{date:el.dataset.date||null,wk:wkSel});break;
    case 'addgoal':openGoal(null);break;
    case 'adddl':openDl(null);if(view==='week'&&sh){const t=todayKey();sh.date=t>=wkSel&&t<addDays(wkSel,7)?t:wkSel;renderSheet()}break;
    case 'fab':if(view==='today')openTask(null,{date:sel,wk:monday(sel)});else if(view==='week')openTask(null,{date:null,wk:wkSel});else if(view==='research'){if(S.projects.length)openLog(null);else openProj(null)}else openGoal(null);break;
    case 'carry':confirmCarry=true;render();break;
    case 'carry-no':confirmCarry=false;render();break;
    case 'carry-yes':{const nx=addDays(wkSel,7);tasksOfWeek(wkSel).filter(x=>!x.done).forEach(t=>{t.date=null;t.wk=nx});confirmCarry=false;persist();break}
    case 'sample':addSample();break;
    case 'clear':confirmClear=true;render();break;
    case 'clear-no':confirmClear=false;render();break;
    case 'clear-yes':clearSample();break;
    case 'sh-cat':readSheet();sh.cat=el.dataset.v;renderSheet();break;
    case 'sh-cd':readSheet();sh.cd=el.dataset.v==='1';renderSheet();break;
    case 'sh-allday':gevRead();sh.allDay=el.dataset.v==='1';if(sh.allDay&&(!sh.ed||sh.ed<sh.sd))sh.ed=sh.sd;renderSheet();break;
    case 'gevopen':openGev(el.dataset.d,el.dataset.i);break;
    case 'gevnew':if(calOK())openGevNew(el.dataset.d||sel,null);break;
    case 'wslot':{if(!calOK()||e.target!==el&&!e.target.classList.contains('hl'))break;const r=el.getBoundingClientRect(),h0=+el.dataset.h0||0;
      const m=Math.floor((h0*60+(e.clientY-r.top)/WK_PX*60)/30)*30;openGevNew(el.dataset.d,m);break}
    case 'wkday':wkDaySel=el.dataset.d;render();break;
    case 'wkpage':wkPage=n<0?Math.max(0,(wkPage||0)-3):Math.min(4,(wkPage||0)+3);render();break;
    case 'callist-refresh':calList=null;calListErr=null;fetchCalList();render();break;
    case 'sh-exp':readSheet();sh.exp=el.dataset.v==='1';renderSheet();break;
    case 'sh-wk':readSheet();sh.wk=addDays(sh.wk,7*n);sh.date=null;renderSheet();break;
    case 'sh-close':sh=null;renderSheet();break;
    case 'sh-save':saveSheet();break;
    case 'sh-del':delSheet();break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='f-note'){S.notes[wkSel]=e.target.value;persist(false)}
  if(e.target.id==='f-dnote'){const v=e.target.value;if(v)S.dnotes[sel]=v;else delete S.dnotes[sel];persist(false)}
  if(sh&&(e.target.id==='f-bs'||e.target.id==='f-be')){readSheet();const d=document.getElementById('sh-dur');if(d)d.textContent=blockDur()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&sh&&e.target.id==='f-text'){e.preventDefault();saveSheet()}if(e.key==='Escape'&&sh){sh=null;renderSheet()}
  const seg=e.target.closest&&e.target.closest('#dial .seg');if(seg&&!sh&&(e.key==='Enter'||e.key===' ')){e.preventDefault();rsel=+seg.dataset.i;openBlock(rsel)}});

/* dial drag: tap to select, drag the arc to move, drag a knob to resize (15-minute steps) */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),snapM=m=>Math.round(m/SNAP)*SNAP;
function svgMin(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return mnorm((Math.atan2(q.y-DC,q.x-DC)+Math.PI/2)/(2*Math.PI)*1440)}
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#dial .seg.sel, #dial .handle'))e.preventDefault()},{passive:false});
document.addEventListener('pointerdown',e=>{
  const svg=e.target.closest&&e.target.closest('#dial');if(!svg||!loaded)return;
  const tgt=e.target.closest('[data-role]');
  if(!tgt){if(rsel!=null){rsel=null;drawDial()}return}
  const idx=+tgt.dataset.i,p=curPlans()[idx];if(!p)return;
  // An unselected arc only counts taps (double-tap selects it); the page can still scroll over it.
  if(tgt.dataset.role==='seg'&&rsel!==idx){tap={idx,id:e.pointerId,x0:e.clientX,y0:e.clientY};return}
  drag={svg,role:tgt.dataset.role,idx,id:e.pointerId,x0:e.clientX,y0:e.clientY,moved:false,last:svgMin(svg,e),acc:0,s0:p.s,d0:rdur(p),wasSel:rsel===idx};
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(tap&&e.pointerId===tap.id&&Math.hypot(e.clientX-tap.x0,e.clientY-tap.y0)>10)tap=null;
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
  if(!drag.moved){drag.moved=true;rsel=drag.idx}
  const m=svgMin(drag.svg,e);let d=m-drag.last;if(d>720)d-=1440;if(d<-720)d+=1440;drag.acc+=d;drag.last=m;
  const p=curPlans()[drag.idx];if(!p)return;const endAbs=drag.s0+drag.d0;
  if(drag.role==='seg'){const dl=snapM(drag.acc);p.s=mnorm(drag.s0+dl);p.e=mnorm(endAbs+dl)}
  else if(drag.role==='hs'){const nd=clamp(endAbs-snapM(drag.s0+drag.acc),SNAP,1440-SNAP);p.s=mnorm(endAbs-nd)}
  else{const nd=clamp(snapM(endAbs+drag.acc)-drag.s0,SNAP,1440-SNAP);p.e=mnorm(drag.s0+nd)}
  drawDial();
});
let tap=null,lastTap=null;
function endDrag(e){
  if(tap&&e.pointerId===tap.id){const t=tap;tap=null;
    if(e.type==='pointerup'&&Math.hypot(e.clientX-t.x0,e.clientY-t.y0)<10){const now=Date.now();
      if(lastTap&&lastTap.idx===t.idx&&now-lastTap.t<400){lastTap=null;rsel=t.idx;drawDial()}else lastTap={idx:t.idx,t:now}}
    return}
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
  if(d.moved)persist(false);
  drawDial();
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
setInterval(()=>{if(view==='today'&&loaded&&!drag){drawDial();drawTl()}if(view==='week'&&loaded&&!sh)render()},60000);
try{matchMedia('(max-width: 899.98px)').addEventListener('change',()=>{if(view==='week'){wkPage=null;render()}})}catch(e){}

boot();
})();
</script>
